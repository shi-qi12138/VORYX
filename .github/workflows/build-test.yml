name: VORYX Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025-vs2026, preset: windows-debug}
          - {runner: windows-2025-vs2026, preset: windows-release}
          - {runner: ubuntu-26.04, preset: linux-debug}
          - {runner: ubuntu-26.04, preset: linux-release}
    env:
      CTEST_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 选择 Linux LLVM 21
        if: runner.os == 'Linux'
        shell: bash
        run: |
          llvm_bin="${RUNNER_TEMP}/voryx-llvm"
          mkdir -p "$llvm_bin"
          ln -s "$(command -v clang-format-21)" "$llvm_bin/clang-format"
          ln -s "$(command -v clang-tidy-21)" "$llvm_bin/clang-tidy"
          echo "$llvm_bin" >> "$GITHUB_PATH"
      - name: 配置、构建和测试
        env:
          VORYX_PRESET: ${{ matrix.preset }}
        shell: pwsh
        run: python tools/environment/build.py --preset "$env:VORYX_PRESET"
      - name: 归档 CTest 结果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.preset }}-reports
          path: |
            build/${{ matrix.preset }}/reports/
            build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: warn
