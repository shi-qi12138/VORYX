name: VORYX Vulkan Hardware

on:
  workflow_dispatch:
    inputs:
      preset:
        description: 选择已配置硬件执行器的 Vulkan Release 预设
        required: true
        type: choice
        options:
          - windows-vulkan-release
          - linux-vulkan-x11-release
          - linux-vulkan-wayland-release

permissions:
  contents: read

jobs:
  vulkan:
    name: ${{ inputs.preset }}
    # 只从默认分支执行受信任代码，硬件执行器不接收 PR 触发。
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, x64, "voryx-${{ inputs.preset }}"]
    timeout-minutes: 30
    env:
      CTEST_PARALLEL_LEVEL: "1"
      VORYX_PRESET: ${{ inputs.preset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 验证 Win32 硬件 Vulkan
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/environment/build.py --preset "$env:VORYX_PRESET"
      - name: 验证原生 Linux 硬件 Vulkan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          kernel_release=$(< /proc/sys/kernel/osrelease)
          if [[ "${kernel_release,,}" == *microsoft* ]]; then
            echo '硬件验收需要原生 Linux 桌面。' >&2
            exit 1
          fi
          if [[ "$VORYX_PRESET" == "linux-vulkan-wayland-release" ]]; then
            unset DISPLAY
          fi
          python3 tools/environment/build.py --preset "$VORYX_PRESET"
      - name: 归档 CTest 结果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.preset }}-reports
          path: |
            build/${{ inputs.preset }}/reports/
            build/${{ inputs.preset }}/Testing/Temporary/
          if-no-files-found: warn
